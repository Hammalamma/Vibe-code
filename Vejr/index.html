<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vejret</title>

  <!-- Leaflet: et færdigt værktøj (et "bibliotek") til at vise kort -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- TopoJSON: hjælper med at læse landenes omrids -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

  <!-- Vores eget udseende -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <input id="by" placeholder="Skriv en by..." value="København">
    <button onclick="søgBy()">Søg</button>
    <button onclick="minPosition()">Hvor er jeg?</button>
  </div>

  <!-- MENU: hvert link peger på en side med # -->
  <nav class="menu">
    <a href="#nu"><span>01</span>Nu</a>
    <a href="#dagens"><span>02</span>Dagens temperatur</a>
    <a href="#kort"><span>03</span>Kort</a>
  </nav>

  <div class="historik" id="historik"></div>

  <!-- ========== SIDE 1: NU ========== -->
  <section class="side" id="side-nu">
    <div class="nu">
      <div>
        <p class="by" id="bynavn">Henter...</p>
        <p class="beskrivelse" id="beskrivelse"></p>
        <p class="grader" id="grader"></p>
      </div>
      <div class="stor-figur" id="stor-figur"></div>
    </div>

    <div class="detaljer">
      <div class="detalje"><p class="etiket">Føles som</p><p class="værdi" id="føles"></p></div>
      <div class="detalje"><p class="etiket">Vind</p><p class="værdi" id="vind"></p></div>
      <div class="detalje"><p class="etiket">Fugt</p><p class="værdi" id="fugt"></p></div>
    </div>

    <div class="dage" id="dage"></div>
  </section>

  <!-- ========== SIDE 2: DAGENS TEMPERATUR ========== -->
  <section class="side" id="side-dagens">
    <div>
      <p class="by">Dagens temperatur i <span id="graf-by"></span></p>
      <p class="beskrivelse" id="graf-tekst"></p>
    </div>
    <div id="graf"></div>
  </section>

  <!-- ========== SIDE 3: KORT ========== -->
  <section class="side" id="side-kort">
    <div>
      <p class="by">Kortet</p>
      <p class="beskrivelse">Byerne svæver over landet · klik på en by</p>
    </div>
    <div id="kort"></div>
  </section>

  <!-- Vores egen kode (hjernen) -->
  <script src="app.js"></script>

</body>
</html>
