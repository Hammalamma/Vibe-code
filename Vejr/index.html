<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vejret</title>
  <style>
    body {
      font-family: sans-serif;
      background: #87ceeb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .kort {
      background: white;
      padding: 30px 50px;
      border-radius: 16px;
      text-align: center;
    }
    input {
      font-size: 18px;
      padding: 8px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    button {
      font-size: 18px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #2f6fde;
      color: white;
      cursor: pointer;
    }
    #temperatur {
      font-size: 64px;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="kort">
    <h1>🌦️ Vejret</h1>
    <input id="by" placeholder="Skriv en by..." value="København">
    <button onclick="hentVejr()">Søg</button>
    <h2 id="bynavn"></h2>
    <p id="temperatur"></p>
    <p id="vind"></p>
  </div>

  <script>
    // Denne "funktion" kører, når man trykker på Søg-knappen
    function hentVejr() {
      const by = document.getElementById("by").value;

      // BESTILLING 1: Find byens placering på landkortet
      const byAdresse = "https://geocoding-api.open-meteo.com/v1/search?count=1&language=da&name=" + by;

      fetch(byAdresse)
        .then(svar => svar.json())
        .then(data => {
          // Hvis API'en ikke kender byen, siger vi det
          if (!data.results) {
            document.getElementById("bynavn").textContent = "Kunne ikke finde " + by + " 🤷";
            document.getElementById("temperatur").textContent = "";
            document.getElementById("vind").textContent = "";
            return;
          }

          const sted = data.results[0];
          document.getElementById("bynavn").textContent = sted.name + ", " + sted.country;

          // BESTILLING 2: Hent vejret det sted
          const vejrAdresse = "https://api.open-meteo.com/v1/forecast?current=temperature_2m,wind_speed_10m&wind_speed_unit=ms"
            + "&latitude=" + sted.latitude
            + "&longitude=" + sted.longitude;

          return fetch(vejrAdresse)
            .then(svar => svar.json())
            .then(vejr => {
              document.getElementById("temperatur").textContent = vejr.current.temperature_2m + " °C";
              document.getElementById("vind").textContent = "💨 Vind: " + vejr.current.wind_speed_10m + " m/s";
            });
        });
    }

    // Hent vejret for København med det samme, når siden åbner
    hentVejr();
  </script>

</body>
</html>
